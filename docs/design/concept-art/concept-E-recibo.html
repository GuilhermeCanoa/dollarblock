<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept E — Recibo (onboarding 1)</title>
<style>
  :root {
    --bg: #0A241D; --surface: #103129; --surface-hi: #15453A;
    --emerald: #00E676; --mint: #64FFDA; --amber: #FFC24B; --red: #FF5252;
    --paper: #E6F2EC; --ink: #13231D; --muted: #A0B2AE;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 14px;
         background: #050f0c; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; padding: 24px 0; }
  .phone { width: 360px; height: 780px; background: var(--bg); border-radius: 36px; overflow: hidden;
           box-shadow: 0 0 0 8px #1b1f1e, 0 30px 80px #000a; display: flex; flex-direction: column; }
  .art { width: 100%; height: 420px; flex: none; display: block; }
  .copy { padding: 4px 24px 0; flex: 1; }
  h1 { font-size: 26px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -.3px; }
  p { font-size: 14px; line-height: 1.5; margin: 0; color: var(--muted); }
  .foot { padding: 0 24px 28px; display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-hi); }
  .dots i:first-child { background: var(--emerald); width: 20px; border-radius: 4px; }
  .next { background: var(--emerald); color: #04210E; font-weight: 700; border: 0; border-radius: 24px; padding: 12px 26px; font-size: 15px; }
  .replay { background: none; border: 1px solid #fff3; color: #fffb; border-radius: 8px; padding: 6px 14px; cursor: pointer; }

  /* ---- animação ---- */
  .paper   { transform: translateY(-340px); }
  .go .paper { animation: print 3.2s steps(32, end) .4s forwards; }
  @keyframes print { to { transform: translateY(0); } }

  .stamp { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .go .stamp { animation: slam .35s cubic-bezier(.2,1.6,.4,1) 3.9s forwards; }
  @keyframes slam { from { opacity: 0; transform: rotate(-14deg) scale(2.4); } to { opacity: .92; transform: rotate(-14deg) scale(1); } }

  .led { animation: blink 1.1s steps(2, jump-none) infinite; }
  .go .led.print { animation: blink .18s steps(2, jump-none) 18 .4s; }
  @keyframes blink { 50% { opacity: .25; } }

  .coin { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .go .coin { animation: fall 2.4s cubic-bezier(.45,0,.9,.6) infinite; }
  .go .c1 { animation-delay: 4.6s; } .go .c2 { animation-delay: 5.5s; } .go .c3 { animation-delay: 6.2s; }
  @keyframes fall { 0% { opacity: 0; transform: translateY(0) rotate(0); }
                    12% { opacity: 1; } 85% { opacity: 1; }
                    100% { opacity: 0; transform: translateY(78px) rotate(200deg); } }

  .glow { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes breathe { 50% { opacity: .55; transform: scale(1.08); } }

  @media (prefers-reduced-motion: reduce) {
    .paper { transform: none !important; animation: none !important; }
    .stamp { opacity: .92 !important; transform: rotate(-14deg) !important; animation: none !important; }
    .coin, .led, .glow { animation: none !important; }
  }
</style>
</head>
<body>
<div class="phone">
  <svg id="art" class="art go" viewBox="0 0 360 420" role="img" aria-label="Um recibo térmico sendo impresso com a conta do dia, carimbado como vencido.">
    <defs>
      <radialGradient id="halo" cx="50%" cy="45%" r="55%">
        <stop offset="0" stop-color="#00E676" stop-opacity=".22"/>
        <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="below-slot"><rect x="0" y="50" width="360" height="370"/></clipPath>
      <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
        <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".45"/>
      </filter>
      <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1c5a4a"/><stop offset="1" stop-color="#0f3329"/>
      </linearGradient>
    </defs>

    <ellipse class="glow" cx="180" cy="215" rx="190" ry="190" fill="url(#halo)"/>

    <!-- recibo (sai da fenda) -->
    <g clip-path="url(#below-slot)">
      <g class="paper" filter="url(#shadow)">
        <path id="sheet" fill="#E6F2EC" d=""/>
        <g font-family="'Courier New', Courier, monospace" fill="#13231D">
          <text x="180" y="78" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="3">DOLLARBLOCK</text>
          <text x="180" y="95" text-anchor="middle" font-size="9.5" fill="#5b6b66" letter-spacing="1.5">STATEMENT · TODAY</text>
          <line x1="86" x2="274" y1="108" y2="108" stroke="#13231D" stroke-dasharray="3 3" opacity=".55"/>

          <text x="86" y="132" font-size="12">Instagram</text><text x="212" y="132" font-size="12" text-anchor="end" fill="#5b6b66">47m</text><text x="274" y="132" font-size="12" text-anchor="end">R$ 2.18</text>
          <text x="86" y="153" font-size="12">TikTok</text><text x="212" y="153" font-size="12" text-anchor="end" fill="#5b6b66">1h12</text><text x="274" y="153" font-size="12" text-anchor="end">R$ 3.36</text>
          <text x="86" y="174" font-size="12">YouTube</text><text x="212" y="174" font-size="12" text-anchor="end" fill="#5b6b66">38m</text><text x="274" y="174" font-size="12" text-anchor="end">R$ 1.77</text>
          <line x1="86" x2="274" y1="190" y2="190" stroke="#13231D" stroke-dasharray="3 3" opacity=".55"/>

          <text x="86" y="212" font-size="12">TIME LEAKED</text><text x="274" y="212" font-size="12" text-anchor="end">2h37</text>
          <text x="86" y="233" font-size="14" font-weight="700">BILLED</text><text x="274" y="233" font-size="14" font-weight="700" text-anchor="end">R$ 7.31</text>
          <line x1="86" x2="274" y1="247" y2="247" stroke="#13231D" stroke-dasharray="3 3" opacity=".55"/>
          <text x="180" y="266" text-anchor="middle" font-size="10" font-style="italic" fill="#5b6b66">A coffee and a half. No refunds.</text>
          <g id="bars" fill="#13231D"></g>
        </g>
        <!-- carimbo -->
        <g class="stamp">
          <rect x="108" y="288" width="146" height="40" rx="5" fill="none" stroke="#FF5252" stroke-width="3.5"/>
          <rect x="113" y="293" width="136" height="30" rx="3" fill="none" stroke="#FF5252" stroke-width="1" opacity=".7"/>
          <text x="181" y="318" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="24" letter-spacing="3" fill="#FF5252">OVERDUE</text>
        </g>
      </g>
    </g>

    <!-- impressora -->
    <rect x="46" y="20" width="268" height="32" rx="10" fill="url(#lip)" stroke="#2e6a59" stroke-width="1.5"/>
    <rect x="62" y="40" width="236" height="6" rx="3" fill="#04120e"/>
    <circle class="led print" cx="288" cy="31" r="3" fill="#64FFDA"/>
    <circle class="led" cx="274" cy="31" r="3" fill="#FFC24B" opacity=".9"/>

    <!-- moedas escapando -->
    <g fill="#FFC24B" stroke="#b9801c" stroke-width="1.5">
      <g class="coin c1"><circle cx="128" cy="345" r="8"/><circle cx="128" cy="345" r="4.5" fill="none" stroke="#b9801c" stroke-width="1"/></g>
      <g class="coin c2"><circle cx="196" cy="350" r="8"/><circle cx="196" cy="350" r="4.5" fill="none" stroke="#b9801c" stroke-width="1"/></g>
      <g class="coin c3"><circle cx="246" cy="344" r="8"/><circle cx="246" cy="344" r="4.5" fill="none" stroke="#b9801c" stroke-width="1"/></g>
    </g>
  </svg>

  <div class="copy">
    <h1>Time is money.<br>Yours is leaking.</h1>
    <p>Instagram, TikTok and YouTube have entire teams of engineers paid to keep you scrolling. DollarBlock opens a tab on each of them: pick the apps that eat your day, set a daily limit, and past that limit they lock.</p>
  </div>
  <div class="foot">
    <div class="dots"><i></i><i></i><i></i></div>
    <button class="next">Next</button>
  </div>
</div>
<button class="replay" onclick="replay()">↻ replay animation</button>

<script>
  // recibo com borda serrilhada embaixo
  (function () {
    const x0 = 70, x1 = 290, top = 40, base = 332, tooth = 10;
    let d = `M${x0} ${top} H${x1} V${base}`;
    for (let x = x1, i = 0; x > x0; x -= tooth, i++) d += ` L${x - tooth / 2} ${base + 8} L${x - tooth} ${base}`;
    document.getElementById('sheet').setAttribute('d', d + ' Z');
    // código de barras determinístico
    const bars = document.getElementById('bars'); let x = 92, s = 7, out = '';
    while (x < 268) { s = (s * 31 + 11) % 17; const w = 1 + (s % 3); out += `<rect x="${x}" y="276" width="${w}" height="9" />`; x += w + 1 + (s % 2); }
    bars.innerHTML = out;
  })();
  function replay() {
    const a = document.getElementById('art');
    a.classList.remove('go'); void a.getBoundingClientRect(); a.classList.add('go');
  }
</script>
</body>
</html>
