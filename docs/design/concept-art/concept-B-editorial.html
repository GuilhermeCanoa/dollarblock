<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept B — Editorial seca (onboarding 1)</title>
<style>
  :root {
    --bg: #0A241D; --surface: #103129; --surface-hi: #15453A;
    --emerald: #00E676; --amber: #FFC24B; --paper: #E6F2EC; --muted: #A0B2AE;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 14px;
         background: #050f0c; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; padding: 24px 0; }
  .phone { width: 360px; height: 780px; background: var(--bg); border-radius: 36px; overflow: hidden;
           box-shadow: 0 0 0 8px #1b1f1e, 0 30px 80px #000a; display: flex; flex-direction: column; }
  .art { width: 100%; height: 380px; flex: none; display: block; }
  .caption { text-align: center; font: italic 14px/1.3 Georgia, "Times New Roman", serif; color: var(--paper); opacity: .85; margin: 0 24px 18px; }
  .copy { padding: 0 24px; flex: 1; }
  h1 { font-size: 26px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -.3px; }
  p { font-size: 14px; line-height: 1.5; margin: 0; color: var(--muted); }
  .foot { padding: 0 24px 28px; display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-hi); }
  .dots i:first-child { background: var(--emerald); width: 20px; border-radius: 4px; }
  .next { background: var(--emerald); color: #04210E; font-weight: 700; border: 0; border-radius: 24px; padding: 12px 26px; font-size: 15px; }

  /* traço de caneta: tudo desenhado em creme, fino, um pouco irregular */
  .ink { fill: none; stroke: var(--paper); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thin { stroke-width: 1.5; }
  .draw { stroke-dasharray: var(--len, 400); stroke-dashoffset: var(--len, 400); animation: draw 1.4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .hand-min  { transform-box: view-box; transform-origin: 180px 128px; animation: spin 14s linear infinite; }
  .hand-hour { transform-box: view-box; transform-origin: 180px 128px; animation: spin 168s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .drop { opacity: 0; animation: drip 1.8s cubic-bezier(.5,0,.9,.55) infinite; }
  .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; }
  @keyframes drip { 0% { opacity: 0; transform: translateY(0); } 10% { opacity: 1; transform: translateY(4px); }
                    80% { opacity: 1; } 100% { opacity: 0; transform: translateY(82px); } }
  .leak { opacity: 0; animation: leak 1.8s cubic-bezier(.5,0,.9,.55) infinite; }
  .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; }
  @keyframes leak { 0%, 55% { opacity: 0; transform: translateY(0); } 62% { opacity: 1; }
                    100% { opacity: 0; transform: translateY(34px); } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .bucket { transform-box: view-box; transform-origin: 180px 312px; animation: sway 3.6s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(1.4deg); } }

  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .hand-min, .hand-hour, .drop, .leak, .eye, .bucket { animation: none; }
    .drop { opacity: 1; }
  }
</style>
</head>
<body>
<div class="phone">
  <svg class="art" viewBox="0 0 360 380" role="img" aria-label="Um homem de terno segura um balde furado sob um relógio que pinga moedas.">
    <defs>
      <radialGradient id="halo" cx="50%" cy="40%" r="55%">
        <stop offset="0" stop-color="#00E676" stop-opacity=".16"/><stop offset="1" stop-color="#00E676" stop-opacity="0"/>
      </radialGradient>
      <g id="coin">
        <circle r="7.5" fill="#FFC24B" stroke="#b9801c" stroke-width="1.4"/>
        <circle r="4" fill="none" stroke="#b9801c" stroke-width="1"/>
      </g>
    </defs>
    <rect width="360" height="380" fill="url(#halo)"/>

    <!-- chão -->
    <path class="ink ink-thin draw" style="--len:330" d="M14 352 H110 M126 352 H346" />

    <!-- relógio suspenso por um cano -->
    <path class="ink ink-thin draw" style="--len:60" d="M180 0 V30" />
    <circle class="ink draw" style="--len:480" cx="180" cy="128" r="74" fill="#103129"/>
    <circle class="ink ink-thin" cx="180" cy="128" r="66" opacity=".45"/>
    <g class="ink ink-thin" opacity=".8">
      <path d="M180 66 V74 M180 182 V190 M118 128 H126 M234 128 H242"/>
      <path d="M149 74 L153 81 M211 74 L207 81 M149 182 L153 175 M211 182 L207 175 M126 97 L133 101 M234 97 L227 101 M126 159 L133 155 M234 159 L227 155"/>
    </g>
    <g class="hand-hour"><path class="ink" stroke-width="3.4" d="M180 128 V96"/></g>
    <g class="hand-min"><path class="ink" stroke-width="2.4" d="M180 128 V80"/></g>
    <circle cx="180" cy="128" r="4.5" fill="#FFC24B" stroke="#0A241D" stroke-width="1.5"/>
    <!-- torneira embaixo do relógio -->
    <path class="ink" d="M174 202 V222 H186 V202"/>
    <path class="ink" d="M170 222 H190 L186 232 H174 Z" fill="#103129"/>

    <!-- moedas pingando -->
    <use class="drop d1" href="#coin" x="180" y="244"/>
    <use class="drop d2" href="#coin" x="180" y="244"/>
    <use class="drop d3" href="#coin" x="180" y="244"/>

    <!-- balde furado + braço -->
    <g class="bucket">
      <path class="ink" d="M158 318 L164 354 H196 L202 318 Z" fill="#15453A"/>
      <path class="ink ink-thin" d="M158 318 H202"/>
      <path class="ink ink-thin" d="M158 318 Q180 290 202 318"/>
      <ellipse cx="180" cy="354" rx="5" ry="2" fill="#0A241D" stroke="#E6F2EC" stroke-width="1.2"/>
    </g>
    <use class="leak l1" href="#coin" x="180" y="356"/>
    <use class="leak l2" href="#coin" x="180" y="356"/>
    <use class="leak l3" href="#coin" x="180" y="356"/>

    <!-- montinho de moedas no chão -->
    <g stroke="#b9801c" stroke-width="1.2" fill="#FFC24B">
      <ellipse cx="206" cy="349" rx="9" ry="3.2"/><ellipse cx="222" cy="350" rx="9" ry="3.2"/>
      <ellipse cx="214" cy="344" rx="9" ry="3.2"/><ellipse cx="192" cy="350" rx="8" ry="3"/>
    </g>

    <!-- homem de terno e chapéu coco -->
    <g>
      <!-- pernas -->
      <path class="ink" d="M106 300 V350 H96 M120 300 V350 H130"/>
      <!-- casaco -->
      <path class="ink" d="M94 224 Q92 300 100 304 H126 Q134 300 132 224 Z" fill="#15453A"/>
      <path class="ink ink-thin" d="M113 224 V304 M113 244 l-4 0 M113 262 l-4 0"/>
      <!-- gravata -->
      <path d="M113 224 L108 232 L113 252 L118 232 Z" fill="#FF5252" stroke="#E6F2EC" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- braço esticado segurando o balde -->
      <path class="ink" d="M130 238 Q150 262 161 312"/>
      <circle cx="161" cy="314" r="3.4" fill="#E6F2EC"/>
      <!-- outra mão no bolso -->
      <path class="ink ink-thin" d="M96 252 Q90 268 100 276"/>
      <!-- cabeça -->
      <circle class="ink" cx="113" cy="200" r="19" fill="#103129"/>
      <!-- chapéu coco -->
      <path class="ink" d="M95 192 Q96 168 113 168 Q130 168 131 192 Z" fill="#0A241D"/>
      <path class="ink" d="M88 192 H138"/>
      <path class="ink ink-thin" d="M97 186 H129" />
      <!-- olhos sonolentos olhando para o leitor -->
      <g class="eye"><ellipse cx="106" cy="203" rx="2.6" ry="3" fill="#E6F2EC"/></g>
      <g class="eye"><ellipse cx="122" cy="203" rx="2.6" ry="3" fill="#E6F2EC"/></g>
      <path class="ink ink-thin" d="M101 198 H111 M117 198 H127" stroke-width="2"/>
      <!-- bigode e boca reta -->
      <path class="ink" d="M104 212 Q113 207 122 212 Q113 215 104 212" fill="#E6F2EC" stroke-width="1.4"/>
      <path class="ink ink-thin" d="M108 219 H118"/>
    </g>
  </svg>
  <p class="caption">“It’s only a little leak.”</p>

  <div class="copy">
    <h1>Time is money.<br>Yours is leaking.</h1>
    <p>Instagram, TikTok and YouTube have entire teams of engineers paid to keep you scrolling. DollarBlock opens a tab on each of them: pick the apps that eat your day, set a daily limit, and past that limit they lock.</p>
  </div>
  <div class="foot">
    <div class="dots"><i></i><i></i><i></i></div>
    <button class="next">Next</button>
  </div>
</div>
</body>
</html>
