<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#01120E;--mint:#64FFDA;--em:#00E676;--white:#fff;--paper:#F4F1E8;--ink:#14231E;--red:#C62828}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2f2d;font-family:Roboto,system-ui,sans-serif}
.phone{width:412px;height:915px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 120% 70% at 50% 42%,#0B3A2C 0%,#03201A 45%,var(--bg) 100%);color:#fff;display:flex;flex-direction:column}
.status{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:500;color:#fff;opacity:.9}
.nav{height:24px;display:flex;justify-content:center;align-items:center}
.nav i{width:108px;height:4px;border-radius:2px;background:#fff;opacity:.55}
.content{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 32px}
.grow{flex:1}
.btn{width:100%;height:54px;border-radius:27px;background:var(--em);color:#04210E;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:.2px}
.sec{margin-top:16px;font-size:14px;font-weight:500;color:rgba(255,255,255,.85)}
.foot{margin:22px 0 10px;font-size:11px;color:rgba(255,255,255,.45);text-align:center}
.foot u{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
/* recibo */
.receipt{width:248px;background:var(--paper);color:var(--ink);font-family:'Roboto Mono',monospace;text-align:center;padding:17px 14px;position:relative}
.receipt .hd{font-size:11px;font-weight:500;letter-spacing:1px;margin-top:3px}
.receipt .meta{font-size:9px;opacity:.7;margin-top:2px}
.receipt hr{border:0;border-top:2px dashed rgba(20,35,30,.35);margin:8px 0}
.receipt .row{display:flex;align-items:center;justify-content:space-between}
.receipt .app{font-weight:700;font-size:18px;text-align:left}
.stamp{font-weight:900;font-size:11px;letter-spacing:1px;color:var(--red);border:2px solid var(--red);border-radius:4px;padding:1px 6px;transform:rotate(-12deg) translateX(6px);opacity:.88}
.receipt .msg{font-size:12px;line-height:17px;opacity:.85}
.receipt .price{font-weight:700;font-size:28px;line-height:34px}
.receipt .cap{font-size:9px;opacity:.7}
.barcode{height:24px;width:88%;margin:0 auto;display:flex}
.label{position:absolute;left:0;right:0;top:-46px;text-align:center;color:#e8efe9;font:600 18px Roboto}
</style></head>
<body>
<div id="root"></div>
<script>
// ───────── mascote (port de ShieldMascot.kt para SVG, unidades da arte; pés na origem) ─────────
const C={Rim:'#0B5E3C',BandL:'#2BF08C',BandD:'#00A86B',FaceL:'#6CF7B0',FaceD:'#00C878',Ink:'#0A3A24',Shades:'#0A0F0D',Limb:'#1B2622',LimbLine:'#0A100E',Sole:'#EFF5F0',Lime:'#00E676'};
const TOP=-86, SC={x:0,y:TOP+26};
const rad=d=>d*Math.PI/180;
function arm(p,side){const sh={x:side*20,y:-68};const a=rad(p[0]);const el={x:sh.x+side*Math.sin(a)*14,y:sh.y+Math.cos(a)*14};const b=rad(p[0]+p[1]);const d={x:side*Math.sin(b),y:Math.cos(b)};return{sh,el,h:{x:el.x+d.x*13,y:el.y+d.y*13},d}}
function shieldPath(t){return `M0 ${t-4} L23 ${t+5} L23 ${t+27} Q22 ${t+45} 0 ${t+56} Q-22 ${t+45} -23 ${t+27} L-23 ${t+5} L-23 ${t+5} Z`}
let gid=0;
function limb(a,b){return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${C.LimbLine}" stroke-width="6.4" stroke-linecap="round"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${C.Limb}" stroke-width="4.8" stroke-linecap="round"/>`}
function handDot(h){return `<circle cx="${h.x}" cy="${h.y}" r="4.2" fill="${C.Limb}" stroke="${C.LimbLine}" stroke-width=".9"/>`}
function sc(s){return `transform="translate(${SC.x} ${SC.y}) scale(${s}) translate(${-SC.x} ${-SC.y})"`}
function mascot(o){
  const p=Object.assign({facing:1,tilt:0,brow:0,quirk:0,look:0,front:[8,-6],back:[8,-6],hideFrontHand:false,hideHands:false,prop:''},o);
  const id=++gid; const t=TOP;
  let s=`<defs><linearGradient id="bg${id}" gradientUnits="userSpaceOnUse" x1="-20" y1="${t}" x2="20" y2="${t+56}"><stop offset="0" stop-color="${C.BandL}"/><stop offset="1" stop-color="${C.BandD}"/></linearGradient>
  <radialGradient id="fg${id}" gradientUnits="userSpaceOnUse" cx="-3" cy="${t+18}" r="34"><stop offset="0" stop-color="${C.FaceL}"/><stop offset="1" stop-color="${C.FaceD}"/></radialGradient></defs>`;
  s+=`<g transform="scale(${p.facing} 1)">`;
  s+=`<ellipse cx="0" cy="0" rx="20" ry="3" fill="rgba(0,0,0,.28)"/>`;
  [-1,1].forEach(side=>{const hip={x:side*5,y:-36},f={x:side*5,y:0};s+=`<line x1="${hip.x}" y1="${hip.y}" x2="${f.x}" y2="${f.y}" stroke="${C.LimbLine}" stroke-width="7.4" stroke-linecap="round"/><line x1="${hip.x}" y1="${hip.y}" x2="${f.x}" y2="${f.y}" stroke="${C.Limb}" stroke-width="5.6" stroke-linecap="round"/>`;
    s+=`<rect x="${f.x-5.5}" y="${f.y-1.2}" width="15" height="2.8" rx="1.4" fill="${C.Sole}"/><rect x="${f.x-5}" y="${f.y-6.2}" width="13.5" height="5.6" rx="3" fill="${C.Limb}" stroke="${C.LimbLine}" stroke-width=".8"/><line x1="${f.x-1.5}" y1="${f.y-4.6}" x2="${f.x+3.5}" y2="${f.y-2.6}" stroke="${C.Lime}" stroke-width="1.1" stroke-linecap="round"/>`});
  const bk=arm(p.back,-1), fr=arm(p.front,1);
  s+=`<g transform="rotate(${p.tilt} ${SC.x} ${SC.y})">`;
  [bk,fr].forEach(a=>{s+=limb(a.sh,a.el)+limb(a.el,a.h)});
  const sp=shieldPath(t);
  s+=`<path d="${sp}" fill="${C.Rim}"/><path d="${sp}" fill="url(#bg${id})" ${sc(.9)}/><path d="${sp}" fill="${C.Rim}" ${sc(.8)}/><path d="${sp}" fill="url(#fg${id})" ${sc(.74)}/>`;
  s+=`<line x1="-3" y1="${t-1}" x2="-19" y2="${t+6}" stroke="rgba(255,255,255,.35)" stroke-width="1.6" stroke-linecap="round"/>`;
  const dx=p.look*2.6, by=t+12, frown=Math.max(0,-p.brow);
  [-1,1].forEach(side=>{const lift=Math.max(0,p.brow)*2.5+(side>0?p.quirk*4:0);const arch=side>0?p.quirk*1.8:0;
    s+=`<path d="M${dx+side*14} ${by+1-lift*.8} Q${dx+side*9} ${by-3+2.5*frown-lift*1.2-arch} ${dx+side*4} ${by+.5+3*frown-lift}" fill="none" stroke="${C.Ink}" stroke-width="2.6" stroke-linecap="round"/>`});
  const gy=t+17;
  [-1,1].forEach(side=>{s+=`<path d="M${dx+side*1.5} ${gy} L${dx+side*19} ${gy} L${dx+side*17.5} ${gy+9} Q${dx+side*10} ${gy+11.5} ${dx+side*3} ${gy+8.5} Z" fill="${C.Shades}" stroke="${C.Ink}" stroke-width="1.4"/>`;
    const lx=dx+side*10.5; s+=`<line x1="${lx-3.5}" y1="${gy+7.5}" x2="${lx-.5}" y2="${gy+1.5}" stroke="rgba(255,255,255,.32)" stroke-width="1.3" stroke-linecap="round"/><line x1="${lx+.5}" y1="${gy+7.5}" x2="${lx+3}" y2="${gy+2.5}" stroke="rgba(255,255,255,.22)" stroke-width=".9" stroke-linecap="round"/>`});
  s+=`<line x1="${dx-20}" y1="${gy+.4}" x2="${dx+20}" y2="${gy+.4}" stroke="${C.Ink}" stroke-width="2.4" stroke-linecap="round"/>`;
  if(p.glint!==undefined){const gx=dx+4+p.glint*13;s+=`<line x1="${gx}" y1="${gy+8}" x2="${gx+4}" y2="${gy+1.5}" stroke="rgba(255,255,255,.8)" stroke-width="1.5" stroke-linecap="round"/>`}
  const dl={x:dx*.6,y:t+40};
  s+=`<g transform="translate(${dl.x} ${dl.y}) scale(${.85*p.facing} .85)"><line x1="0" y1="-10" x2="0" y2="10" stroke="${C.Ink}" stroke-width="2.4" stroke-linecap="round"/><path d="M5.5 -5.5 C3 -8.5 -6 -8.5 -6 -4 C-6 0 6 -.5 6 4 C6 8.5 -3 8.5 -5.5 5.5" fill="none" stroke="${C.Ink}" stroke-width="3" stroke-linecap="round"/></g>`;
  if(!p.hideHands){s+=handDot(bk.h); if(!p.hideFrontHand) s+=handDot(fr.h);}
  if(p.prop) s+=p.prop(fr.h,fr.d);
  s+=`</g></g>`;
  return {svg:s, front:fr, back:bk};
}
function svgWrap(inner,vb,w,h,style=''){return `<svg width="${w}" height="${h}" viewBox="${vb}" style="${style};overflow:visible">${inner}</svg>`}

// props
function miniReceipt(h){const w=22,hh=30,l=h.x-w/2+3,t=h.y-4;let z='';const n=6,st=w/n;for(let i=n;i>=1;i--){z+=` L${l+i*st-st/2} ${t+hh-2} L${l+(i-1)*st} ${t+hh}`}
  let s=`<g transform="rotate(-8 ${h.x} ${h.y})"><path d="M${l} ${t} L${l+w} ${t} L${l+w} ${t+hh}${z} Z" fill="#F4F1E8" stroke="rgba(0,0,0,.25)" stroke-width=".5"/>`;
  [[.14,.5],[.24,.7]].forEach(([y,ww])=>s+=`<line x1="${l+w*(1-ww)/2}" x2="${l+w*(1+ww)/2}" y1="${t+hh*y}" y2="${t+hh*y}" stroke="rgba(20,35,30,.5)" stroke-width=".9"/>`);
  s+=`<rect x="${l+w*.22}" y="${t+hh*.33}" width="${w*.6}" height="${hh*.13}" rx=".8" fill="none" stroke="#C62828" stroke-width="1" transform="rotate(-14 ${l+w*.5} ${t+hh*.4})"/>`;
  s+=`<line x1="${l+w*.22}" x2="${l+w*.78}" y1="${t+hh*.68}" y2="${t+hh*.68}" stroke="#14231E" stroke-width="2.6"/><line x1="${l+w*.15}" x2="${l+w*.85}" y1="${t+hh*.8}" y2="${t+hh*.8}" stroke="rgba(20,35,30,.4)" stroke-width=".8"/></g>`;
  return s+handDot({x:h.x-4,y:h.y+1})+handDot(h)}
function stampProp(h){return `<rect x="${h.x-3}" y="${h.y-13}" width="6" height="11" rx="3" fill="#5A3A22"/><circle cx="${h.x}" cy="${h.y-14}" r="4.4" fill="#7A5232"/><rect x="${h.x-7.5}" y="${h.y+1}" width="15" height="5" rx="1.2" fill="#2A2F2C"/><rect x="${h.x-7}" y="${h.y+5.6}" width="14" height="1.8" fill="#C62828"/>`+handDot(h)}

// recibo HTML
function zig(w,h,tooth=9,d=5){const n=Math.round(w/tooth),st=w/n;let pts=[`0px ${d}px`];for(let i=0;i<n;i++){pts.push(`${i*st+st/2}px 0px`,`${(i+1)*st}px ${d}px`)}pts.push(`${w}px ${h-d}px`);for(let i=n;i>=1;i--){pts.push(`${i*st-st/2}px ${h}px`,`${(i-1)*st}px ${h-d}px`)}return `polygon(${pts.join(',')})`}
function barcode(){let r=1234567,s='';const m=[1,1,1];for(let i=0;i<52;i++){r=(r*16807)%2147483647;m.push(1+r%3)}m.push(1,1,1);const tot=m.reduce((a,b)=>a+b);m.forEach((v,i)=>s+=`<div style="flex:${v/tot};background:${i%2==0?'#14231E':'transparent'}"></div>`);return `<div class="barcode">${s}</div>`}
const shieldIcon=`<svg width="22" height="22" viewBox="-26 -92 52 64"><path d="${shieldPath(TOP)}" fill="#0B4033"/><text x="0" y="-46" font-size="30" font-weight="900" text-anchor="middle" fill="#F4F1E8" font-family="Roboto">$</text></svg>`;
function receipt(o={}){const msg=o.msg??'O limite que você mesmo definiu acabou. Pra seguir hoje, é um passe do dia — vale até a meia-noite.';
  return `<div style="filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))"><div class="receipt" style="${o.style||''}" data-zig>${shieldIcon}<div class="hd">DOLLARBLOCK · FATURA</div>${o.noMeta?'':'<div class="meta">Nº 418273 · 06/11/2026 21:47</div>'}<hr>
  <div class="row"><div class="app">Instagram</div><div class="stamp" style="${o.stampStyle||''}">BLOQUEADO</div></div><hr>
  ${msg?`<div class="msg">${msg}</div><hr>`:''}<div class="price">R$ 1,00</div><div class="cap">passe do dia · vale até a meia-noite</div>${o.noBarcode?'':'<hr>'+barcode()}</div></div>`}

const status=`<div class="status"><span>21:47</span><span>▾ ◢ ▮</span></div>`;
const nav=`<div class="nav"><i></i></div>`;
const controls=(p='Pagar o passe do dia · R$ 1,00')=>`<div class="btn">${p}</div><div class="sec">Ficar com meu dinheiro</div><div class="foot"><u>Entenda o bloqueio</u> · cobrança pelo Google Play</div>`;

// ───────── Proposta A: o mascote é a tela ─────────
function A(){const u=2.3;const m=mascot({front:[96,-40],back:[42,-112],tilt:-4,brow:.15,quirk:.7,look:.4,prop:miniReceipt,hideFrontHand:true});
  return `<div class="phone">${status}<div class="content"><div class="grow"></div>
  ${svgWrap(m.svg,'-60 -112 120 118',120*u,118*u)}
  <div style="margin-top:18px;font-size:26px;font-weight:500;text-align:center">Instagram fechou por hoje</div>
  <div style="margin-top:8px;font-size:15px;line-height:21px;color:rgba(255,255,255,.7);text-align:center">Volta amanhã de graça — ou agora,<br>com o passe do dia.</div>
  <div style="margin-top:26px;font:700 42px 'Roboto Mono';color:var(--mint)">R$ 1,00</div>
  <div style="font:12px 'Roboto Mono';color:rgba(255,255,255,.55)">vale até a meia-noite</div>
  <div style="margin-top:14px;font:500 12px Roboto;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:5px 12px">🧾 ver fatura completa</div>
  <div class="grow"></div>${controls('Pagar o passe do dia')}</div>${nav}</div>`}

// ───────── Proposta B: segurando o recibo por trás ─────────
function B(){const u=2.9;const grip=[24,6];const m=mascot({front:grip,back:grip,brow:-.3,hideHands:true});const hands=handDot(arm(grip,1).h)+handDot(arm(grip,-1).h);
  const W=248,H=100*u; const vb=`-42.76 -96 85.52 100`;
  return `<div class="phone">${status}<div class="content"><div class="grow"></div>
  <div style="position:relative;width:${W}px">
    <div style="position:absolute;top:0;left:0">${svgWrap(m.svg,vb,W,H)}</div>
    <div style="height:${52*u}px"></div>
    <div style="position:relative">${receipt({noMeta:true})}</div>
    <div style="position:absolute;top:0;left:0;pointer-events:none">${svgWrap(hands,vb,W,H)}</div>
  </div>
  <div class="grow"></div>${controls()}</div>${nav}</div>`}

// ───────── Proposta C: o carimbo ─────────
function C3(){const u=1.95;const fr=[122,24];const m=mascot({facing:-1,front:fr,back:[42,-112],tilt:6,brow:.5,quirk:.3,look:.4,glint:.35,prop:stampProp,hideFrontHand:true});
  return `<div class="phone">${status}<div class="content" style="padding:0 24px"><div class="grow"></div>
  <div style="font-size:17px;font-weight:500;color:rgba(255,255,255,.8)">Sua fatura chegou</div>
  <div style="position:relative;width:100%;margin-top:22px;height:430px">
    <div style="position:absolute;left:4px;top:10px;transform:rotate(-1.5deg)">${receipt({msg:'Limite diário atingido. O app volta amanhã de graça.',style:'width:252px',stampStyle:'font-size:15px;padding:2px 8px;border-width:2.5px;transform:rotate(-12deg) translateX(10px) scale(1.05)'})}</div>
    <div style="position:absolute;right:-22px;bottom:-34px">${svgWrap(m.svg,'-50 -125 80 130',80*u,130*u)}</div>
  </div>
  <div class="grow"></div>${controls()}</div>${nav}</div>`}

const v=new URLSearchParams(location.search).get('v')||'all';
const root=document.getElementById('root');
if(v==='all'){document.body.style.cssText='background:#1d2220;padding:70px 40px 40px;display:flex;gap:40px;width:max-content';
  root.style.cssText='display:flex;gap:48px';
  root.innerHTML=[['A · O mascote é a tela',A()],['B · Atrás do recibo',B()],['C · O carimbo',C3()]].map(([l,h])=>`<div style="position:relative">${h.replace('class="phone"','class="phone" style="border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.5)"')}<div class="label">${l}</div></div>`).join('');
} else root.innerHTML={a:A,b:B,c:C3}[v]();
// recorte serrilhado dos recibos (precisa do tamanho final)
requestAnimationFrame(()=>document.querySelectorAll('[data-zig]').forEach(e=>{e.style.clipPath=zig(e.offsetWidth,e.offsetHeight)}));
</script>
</body></html>
