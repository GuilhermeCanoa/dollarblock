<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#123B30"/>
      <stop offset="100%" stop-color="#0A241D"/>
    </radialGradient>
    <linearGradient id="ticketFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#00C264"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- ticket / passe perfurado -->
  <g transform="translate(512 522) rotate(-6)">
    <!-- corpo do ticket com recortes semicirculares nas bordas verticais (efeito perfurado) -->
    <path fill="url(#ticketFill)" d="
      M -380,-230
      L 380,-230
      A 40,40 0 0 0 380,-150
      A 40,40 0 0 0 380,-70
      A 40,40 0 0 0 380,10
      A 40,40 0 0 0 380,90
      A 40,40 0 0 0 380,170
      A 40,40 0 0 0 380,230
      L -380,230
      A 40,40 0 0 0 -380,150
      A 40,40 0 0 0 -380,70
      A 40,40 0 0 0 -380,-10
      A 40,40 0 0 0 -380,-90
      A 40,40 0 0 0 -380,-170
      Z"/>

    <!-- linha tracejada de destaque (talão) -->
    <line x1="185" y1="-230" x2="185" y2="230" stroke="#0A241D" stroke-width="13" stroke-dasharray="2 30" stroke-linecap="round"/>

    <!-- cifrão vazado, centralizado na parte principal do ticket -->
    <g transform="translate(-55 6)">
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
            font-family="Georgia, 'Times New Roman', serif" font-weight="700"
            font-size="460" fill="#0A241D">$</text>
    </g>

    <!-- selo circular no canhoto direito -->
    <g transform="translate(270 0)">
      <circle r="72" fill="none" stroke="#0A241D" stroke-width="12"/>
      <circle r="42" fill="#0A241D"/>
    </g>
  </g>
</svg>
